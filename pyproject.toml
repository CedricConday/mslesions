[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mslesions"
version = "0.1.0"
description = "Lesion measures for multiple sclerosis MRI: McDonald 2024 topography of every lesion, optic nerve by OCT/VEP and the five-location count, T1 black holes, and brain parenchymal fraction, all behind a tissue-split gate that refuses scans it cannot read."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Cedric Conday"}]
keywords = ["multiple sclerosis"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License", "Topic :: Scientific/Engineering :: Medical Science Apps."]
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2", "nibabel>=5", "msdataqc>=0.1.0"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/CedricConday/mslesions"

[project.scripts]
mslesions = "mslesions.cli:main"

[tool.setuptools.packages.find]
include = ["mslesions*"]

[tool.setuptools.package-data]
"*" = ["*.json"]

[tool.ruff]
line-length = 120
target-version = "py310"
